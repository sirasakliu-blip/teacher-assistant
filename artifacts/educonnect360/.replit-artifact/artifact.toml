kind = "web"
previewPath = "/"
title = "EduConnect360"
version = "1.0.0"
id = "artifacts/educonnect360"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21978

[services.development]
run = "pnpm --filter @workspace/educonnect360 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/educonnect360", "run", "build" ]
serve = "static"
publicDir = "artifacts/educonnect360/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21978"
BASE_PATH = "/"
